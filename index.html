<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src &#39;self&#39;; script-src &#39;self&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; data:; font-src &#39;self&#39;; connect-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;self&#39;; form-action &#39;none&#39;">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shyam Bahmani</title>
    <meta name="description" content="Thoughts, long reads, and the occasional rant by Shyam Bahmani." />

    <!-- Tab/bookmark icon (SVG favicon — works in all modern browsers). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0c0a0a" />

    <!-- Intentionally kept out of search engines. This is a personal corner, not a
         broadcast — reachable by anyone with the link, but not indexed/listed. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Link previews: how the site looks when the link is pasted into
         WhatsApp / Discord / iMessage / Slack etc. (noindex above is unaffected —
         these only control the unfurled card, not search visibility).
         Note: hash routes (/#/blog/...) can't have per-post cards on a static
         host — unfurlers ignore the #fragment — so this is a single site-wide card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shyam Bahmani" />
    <meta property="og:title" content="Shyam Bahmani" />
    <meta property="og:description" content="Thoughts, long reads, and the occasional rant by Shyam Bahmani." />
    <meta property="og:url" content="https://shyambahmani-dev.github.io/" />
    <!-- Preview image lives at public/og.png (copied verbatim to the site root on
         build). Static file at a fixed URL so crawlers/unfurlers can fetch it
         (they don't run JS, so a src/assets import wouldn't work). Currently the
         914×490 hero image; swap the file (keep the name + update width/height
         below) to change the card. -->
    <meta property="og:image" content="https://shyambahmani-dev.github.io/og.png" />
    <meta property="og:image:width" content="914" />
    <meta property="og:image:height" content="490" />
    <meta property="og:image:alt" content="Shyam Bahmani" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shyam Bahmani" />
    <meta name="twitter:description" content="Thoughts, long reads, and the occasional rant by Shyam Bahmani." />
    <meta name="twitter:image" content="https://shyambahmani-dev.github.io/og.png" />

    <!-- Fonts: Fraunces (display serif) + Inter Tight (UI) + Open Sans (body) + JetBrains Mono
         (labels). SELF-HOSTED from /fonts/ (@font-face in src/index.css) — no Google Fonts CDN,
         so the type can't fall back to system fonts if a CDN is blocked/offline. Preload the
         two most-visible faces (the Fraunces hero + Open Sans body) so first paint has them. -->
    <link rel="preload" href="/fonts/fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/open-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" crossorigin src="/assets/index-CeaJZrF6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B93FsLaQ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
